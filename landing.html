<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova3</title>
    <link rel="stylesheet" href="landing-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
        </div>
        <nav class="main-nav">
            <a href="#" target="_blank" class="intranet-button">Intranet</a>
        </nav>
    </header>

    <main>
        <section class="content-section">
            
            <a href="#" class="card-option" id="card-pavimentos">
                <div class="card-logo">
                    <img src="images/logopavimentos.png" alt="Logo Innova3 Pavimentos">
                </div>
            </a>

            <a href="https://innova3railways.com/" class="card-option" id="card-railways">
                <div class="card-logo">
                    <img src="images/logorailways.png" alt="Logo Innova3 Railways">
                </div>
            </a>

        </section>
    </main>
    <section class="contact-form-section">
        <div class="form-container">
            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
                <div class="form-group">
                    <label for="motivo">Motivo de Contacto</label>
                    <input type="text" id="motivo" name="motivo" required>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </section>

  <div id="footer-placeholder"></div>


</body>
</html>
